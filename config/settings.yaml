# Quant System 配置文件
# 参考 openclaw-data-china-stock 的配置驱动架构

MARKET:
  start_date: "2020-01-01"
  end_date: "2026-05-20"
  stock_pool: "全A"
  rebalance_freq: "monthly"
  top_n_stocks: 20
  min_market_cap: 1000000000
  min_days_listed: 252

TRADING_COST:
  commission_rate: 0.0003
  stamp_tax_rate: 0.001
  transfer_fee: 0.00002
  slippage_pct: 0.001
  min_commission: 5

RISK:
  max_position_pct: 0.10
  max_industry_pct: 0.30
  max_drawdown: 0.15
  max_daily_loss: 0.03
  risk_per_trade_pct: 0.01
  target_leverage: 1.0

FACTORS:
  momentum:
    lookback: 20
    weight: 0.25
  reversal:
    lookback: 5
    weight: 0.15
  volume_ratio:
    lookback: 20
    weight: 0.10
  rsi:
    period: 14
    oversold: 30
    overbought: 70
    weight: 0.10
  ma_trend:
    short: 5
    long: 20
    weight: 0.15
  turnover_trend:
    lookback: 20
    weight: 0.10
  amplitude:
    lookback: 10
    weight: 0.05
  value_bp:
    weight: 0.10

SIGNAL_WEIGHTS:
  technical: 0.50
  fund_flow: 0.25
  topic_heat: 0.25

# 数据源优先级链
DATA_SOURCES:
  stock_list:
    primary: "akshare"
    fallback: ["file_cache"]
  daily_kline:
    primary: "tencent"
    fallback: ["akshare", "disk_cache"]
  realtime_quote:
    primary: "tencent"
    fallback: ["sina"]
  hot_stocks:
    primary: "hexin"
    fallback: ["eastmoney"]
  northbound:
    primary: "hexin"
    fallback: ["eastmoney"]

# 质量门配置
QUALITY_GATES:
  daily_kline:
    min_rows: 1
    max_null_ratio: 0.5
    required_columns: ["date", "code", "close", "volume"]
    min_unique_codes: 5
  realtime_quote:
    min_rows: 1
    max_null_ratio: 0.8
    required_columns: ["code", "close"]

# 韧性配置
RESILIENCE:
  circuit_breaker:
    failure_threshold: 3
    recovery_timeout: 60
  upstream_spacing:
    min_interval_sec: 0.1
