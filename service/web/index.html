<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quant Service</title>
<style>
:root {
  --bg: #0f1117;
  --panel: #1a1d27;
  --border: #2a2d3a;
  --text: #e0e0e0;
  --muted: #6b7280;
  --green: #22c55e;
  --red: #ef4444;
  --blue: #3b82f6;
  --yellow: #eab308;
  --accent: #6366f1;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:14px; line-height:1.5; }
a { color:var(--blue); text-decoration:none; }
.header { background:var(--panel); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; }
.header h1 { font-size:18px; font-weight:600; }
.header .market-badge { font-size:12px; padding:4px 10px; border-radius:12px; font-weight:500; }
.badge-open { background:#064e3b; color:#34d399; }
.badge-closed { background:#1f2937; color:var(--muted); }
.nav { display:flex; gap:4px; padding:0 24px; background:var(--panel); border-bottom:1px solid var(--border); }
.nav button { background:none; border:none; color:var(--muted); padding:10px 16px; cursor:pointer; font-size:13px; border-bottom:2px solid transparent; transition:all .2s; }
.nav button:hover { color:var(--text); }
.nav button.active { color:var(--accent); border-bottom-color:var(--accent); }
.main { max-width:1280px; margin:0 auto; padding:20px 24px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-bottom:20px; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; }
.card h3 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.card .value { font-size:28px; font-weight:700; }
.card .sub { font-size:12px; color:var(--muted); margin-top:4px; }
.up { color:var(--green); }
.down { color:var(--red); }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); font-size:13px; }
th { color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; }
tr:hover { background:rgba(255,255,255,.02); }
.section-title { font-size:16px; font-weight:600; margin:24px 0 12px; }
.badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; }
.badge-tag { background:var(--accent); color:#fff; margin:0 2px; }
.alert { background:#451a03; border:1px solid #78350f; border-radius:6px; padding:10px 14px; margin:6px 0; font-size:13px; color:#fbbf24; }
.btn { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:8px 16px; font-size:13px; cursor:pointer; }
.btn:hover { opacity:.9; }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.form-row { display:flex; gap:12px; align-items:end; margin-bottom:16px; flex-wrap:wrap; }
.form-row label { font-size:12px; color:var(--muted); display:block; margin-bottom:4px; }
.form-row input, .form-row select { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:6px; font-size:13px; }
.flex { display:flex; align-items:center; gap:8px; }
.spin { animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.empty { text-align:center; color:var(--muted); padding:40px; }
.tag { display:inline-block; background:var(--border); color:var(--text); padding:2px 6px; border-radius:3px; font-size:11px; margin:1px; }
#log-panel { max-height:300px; overflow-y:auto; font-family:monospace; font-size:12px; }
.tab-content { display:none; }
.tab-content.active { display:block; }
</style>
</head>
<body>

<div class="header">
  <h1>Quant Service</h1>
  <div class="flex">
    <span id="market-badge" class="market-badge badge-closed">--</span>
    <span id="clock" style="font-size:12px;color:var(--muted)"></span>
  </div>
</div>

<div class="nav">
  <button class="active" onclick="showTab('dashboard')">仪表盘</button>
  <button onclick="showTab('watchlist')">标的池</button>
  <button onclick="showTab('strategies')">策略管理</button>
  <button onclick="showTab('signals')">交易信号</button>
  <button onclick="showTab('hotstocks')">热点股票</button>
  <button onclick="showTab('backtest')">回测</button>
</div>

<div class="main">

<!-- ==================== 仪表盘 ==================== -->
<div id="tab-dashboard" class="tab-content active">
  <div class="grid" id="kpi-grid">
    <div class="card"><h3>账户总资产</h3><div class="value" id="kpi-total">--</div></div>
    <div class="card"><h3>累计盈亏</h3><div class="value" id="kpi-pnl">--</div></div>
    <div class="card"><h3>最大回撤</h3><div class="value" id="kpi-maxdd">--</div></div>
    <div class="card"><h3>持仓数量</h3><div class="value" id="kpi-pos">--</div></div>
  </div>
  <div class="grid" id="kpi-grid2" style="display:none">
    <div class="card"><h3>Sharpe</h3><div class="value" id="kpi-sharpe">--</div></div>
    <div class="card"><h3>VaR (95%)</h3><div class="value" id="kpi-var">--</div></div>
    <div class="card"><h3>胜率</h3><div class="value" id="kpi-winrate">--</div></div>
    <div class="card"><h3>盈亏比</h3><div class="value" id="kpi-plratio">--</div></div>
  </div>
  <div id="alerts-container"></div>
  <div class="section-title">当前持仓</div>
  <table id="positions-table"><thead><tr><th>代码</th><th>名称</th><th>持仓</th><th>现价</th><th>成本</th><th>盈亏</th><th>占比</th></tr></thead><tbody><tr><td colspan="7" class="empty">暂无持仓</td></tr></tbody></table>
</div>

<!-- ==================== 标的池 ==================== -->
<div id="tab-watchlist" class="tab-content">
  <div class="flex" style="margin-bottom:16px;gap:8px;flex-wrap:wrap">
    <input id="wl-code" placeholder="代码 (如 510300.SH)" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;width:160px">
    <input id="wl-name" placeholder="名称" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;width:130px">
    <select id="wl-type" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-size:13px">
      <option value="ETF">ETF</option><option value="STOCK">STOCK</option>
    </select>
    <input id="wl-group" placeholder="分组" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;width:100px">
    <button class="btn" onclick="addWatchlistItem()">添加</button>
    <button class="btn btn-outline" onclick="loadWatchlist()">刷新列表</button>
  </div>
  <div style="margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap" id="preset-buttons"></div>
  <table id="watchlist-table"><thead><tr><th>代码</th><th>名称</th><th>类型</th><th>分组</th><th>现价</th><th>涨跌</th><th>操作</th></tr></thead><tbody></tbody></table>
  <div id="watchlist-empty" class="empty">标的中为空，添加代码或加载预设</div>
</div>

<!-- ==================== 交易信号 ==================== -->
<div id="tab-signals" class="tab-content">
  <div class="flex" style="margin-bottom:16px">
    <button class="btn" onclick="loadSignals(true)">刷新信号</button>
    <span style="font-size:12px;color:var(--muted)" id="signal-updated"></span>
  </div>
  <table id="signals-table"><thead><tr><th>排名</th><th>代码</th><th>名称</th><th>评分</th><th>涨跌</th><th>来源</th><th>理由</th></tr></thead><tbody></tbody></table>
  <div id="signals-empty" class="empty">点击刷新获取信号</div>
</div>

<!-- ==================== 热点股票 ==================== -->
<div id="tab-hotstocks" class="tab-content">
  <div class="flex" style="margin-bottom:16px">
    <button class="btn" onclick="loadHotStocks()">刷新热点</button>
    <span id="hotstocks-date" style="font-size:12px;color:var(--muted)"></span>
  </div>
  <div id="hotstocks-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px"></div>
</div>

<!-- ==================== 回测 ==================== -->
<div id="tab-backtest" class="tab-content">
  <div class="card" style="max-width:600px">
    <h3>策略回测</h3>
    <div class="form-row">
      <div style="min-width:200px">
        <label>选择策略</label>
        <select id="bt-strategy" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-size:13px;width:100%"></select>
      </div>
      <div>
        <label>采样股票数</label>
        <input id="bt-stocks" type="number" value="200" min="10" max="500" style="width:100px">
      </div>
    </div>
    <div style="margin-bottom:12px">
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px">快捷时间段</label>
      <div class="flex" style="gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm btn-outline period-btn" data-period="6m" onclick="setPeriod('6m')">近半年</button>
        <button class="btn btn-sm btn-outline period-btn" data-period="1y" onclick="setPeriod('1y')">近一年</button>
        <button class="btn btn-sm btn-outline period-btn" data-period="3y" onclick="setPeriod('3y')">近三年</button>
        <button class="btn btn-sm btn-outline period-btn" data-period="5y" onclick="setPeriod('5y')">近五年</button>
        <button class="btn btn-sm btn-outline period-btn" data-period="10y" onclick="setPeriod('10y')">近十年</button>
        <button class="btn btn-sm btn-outline period-btn active" data-period="" onclick="setPeriod('')">自定义</button>
      </div>
    </div>
    <div class="form-row" id="bt-date-fields">
      <div><label>起始日期</label><input id="bt-start" type="text" value="20220101" style="width:120px"></div>
      <div><label>结束日期</label><input id="bt-end" type="text" value="20260515" style="width:120px"></div>
    </div>
    <button class="btn" onclick="triggerBacktest()">🚀 启动回测</button>
    <div id="bt-status" style="margin-top:8px;font-size:13px"></div>
    <div id="bt-log" style="margin-top:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;max-height:200px;overflow-y:auto;font-family:monospace;font-size:12px;display:none"></div>
  </div>

  <!-- Backtest Results -->
  <div id="bt-results" style="display:none;margin-top:20px">
    <div class="section-title">📊 回测结果</div>
    <div id="bt-meta" style="font-size:12px;color:var(--muted);margin-bottom:12px"></div>
    <div class="grid" id="bt-metrics-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"></div>

    <div class="section-title" style="margin-top:20px">📈 净值曲线</div>
    <div id="bt-equity-container" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px;overflow-x:auto">
      <div id="bt-equity-chart" style="height:240px;position:relative"></div>
    </div>

    <div class="section-title" style="margin-top:20px">📅 月度收益 (%)</div>
    <div id="bt-monthly-container" style="overflow-x:auto"></div>

    <div class="section-title" style="margin-top:20px">📆 年度收益 (%)</div>
    <div id="bt-yearly-container" style="overflow-x:auto"></div>
  </div>
</div>

<!-- ==================== 策略管理 ==================== -->
<div id="tab-strategies" class="tab-content">
  <div class="flex" style="margin-bottom:12px;justify-content:space-between;flex-wrap:wrap">
    <div class="flex" style="gap:8px">
      <button class="btn" onclick="openStrategyEditor()">+ 新建策略</button>
      <button class="btn btn-outline" onclick="loadStrategies()">刷新列表</button>
    </div>
    <span id="strategy-count" style="font-size:12px;color:var(--muted)"></span>
  </div>
  
  <!-- Strategy list -->
  <div id="strategy-list"></div>
  
  <!-- Strategy editor modal -->
  <div id="strategy-editor" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;overflow-y:auto;padding:40px 20px">
    <div class="card" style="max-width:700px;margin:0 auto">
      <div class="flex" style="justify-content:space-between;margin-bottom:16px">
        <h2 id="editor-title">编辑策略</h2>
        <button onclick="closeStrategyEditor()" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">✕</button>
      </div>
      <div class="form-row">
        <div><label>策略ID</label><input id="s-id" placeholder="unique_id" style="width:180px"></div>
        <div><label>名称</label><input id="s-name" placeholder="策略名称" style="width:180px"></div>
      </div>
      <div class="form-row">
        <div><label>类型</label><select id="s-type" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-size:13px;width:220px"></select></div>
        <div><label>分类</label><input id="s-category" placeholder="ETF/股票/混合" style="width:140px"></div>
      </div>
      <div class="form-row">
        <div><label>状态</label><select id="s-status" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-size:13px">
          <option value="active">活跃</option><option value="draft">草稿</option><option value="archived">归档</option>
        </select></div>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">描述</label>
        <textarea id="s-desc" rows="2" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-size:13px;resize:vertical"></textarea>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">参数 (JSON)</label>
        <textarea id="s-params" rows="8" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-size:12px;font-family:monospace;resize:vertical"></textarea>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px">备注</label>
        <textarea id="s-notes" rows="2" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-size:13px;resize:vertical"></textarea>
      </div>
      <div class="flex" style="gap:8px">
        <button class="btn" onclick="saveStrategy()">保存</button>
        <button class="btn btn-outline" onclick="closeStrategyEditor()">取消</button>
      </div>
    </div>
  </div>
</div>

</div>

<script>
const API = '';
let autoRefresh = null;

// ---- Tabs ----
function showTab(name) {
  document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(e => e.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'strategies') loadStrategies();
  if (name === 'signals') loadSignals();
  if (name === 'hotstocks') loadHotStocks();
  if (name === 'backtest') { initBacktestForm(); loadBacktestResults(); }
}

// ---- Clock ----
setInterval(() => {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('zh-CN',{hour12:false});
}, 1000);

// ---- Watchlist ----
async function loadWatchlist() {
  const data = await api('/api/watchlist');
  const tbody = document.querySelector('#watchlist-table tbody');
  const empty = document.getElementById('watchlist-empty');
  
  // Load presets
  if (data && data.presets) {
    document.getElementById('preset-buttons').innerHTML = Object.keys(data.presets).map(name =>
      `<button class="btn btn-sm btn-outline" onclick="loadPreset('${name}')">📋 ${name}</button>`
    ).join('');
  }
  
  if (!data || !data.items || !data.items.length) {
    empty.style.display = 'block';
    document.querySelector('#watchlist-table').style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  document.querySelector('#watchlist-table').style.display = '';
  
  tbody.innerHTML = data.items.map((item, i) => `<tr>
    <td>${item.code||''}</td><td>${item.name||'--'}</td>
    <td><span class="badge badge-tag">${item.type||'STOCK'}</span></td>
    <td>${item.group||'--'}</td>
    <td><span id="wl-px-${cleanCode(item.code)}">--</span></td>
    <td><span id="wl-pct-${cleanCode(item.code)}">--</span></td>
    <td><button class="btn btn-sm btn-outline" onclick="removeWatchlistItem('${item.code}',${i})" style="color:var(--red)">删除</button></td>
  </tr>`).join('');
  
  // Also load quotes
  loadWatchlistQuotes();
}

function cleanCode(c) { return (c||'').replace(/\./g,'_'); }

async function loadPreset(name) {
  await api('/api/watchlist', 'POST', {action:'load_preset', preset_name: name});
  loadWatchlist();
}

async function addWatchlistItem() {
  const code = document.getElementById('wl-code').value.trim().toUpperCase();
  const name = document.getElementById('wl-name').value.trim();
  const type = document.getElementById('wl-type').value;
  const group = document.getElementById('wl-group').value.trim();
  if (!code) return;
  
  const r = await api('/api/watchlist', 'POST', {action:'add', code, name, type, group});
  if (r && r.success) {
    document.getElementById('wl-code').value = '';
    document.getElementById('wl-name').value = '';
    loadWatchlist();
  } else {
    alert(r?.message || '添加失败');
  }
}

async function removeWatchlistItem(code, idx) {
  await api('/api/watchlist', 'POST', {action:'remove', code});
  loadWatchlist();
}

async function loadWatchlistQuotes() {
  const data = await api('/api/watchlist/quotes');
  if (!data || !data.quotes) return;
  for (const q of data.quotes) {
    const id = cleanCode(q.code);
    const pxEl = document.getElementById('wl-px-'+id);
    const pctEl = document.getElementById('wl-pct-'+id);
    if (pxEl) pxEl.textContent = q.price ? q.price.toFixed(3) : '--';
    if (pctEl) {
      pctEl.textContent = q.change_pct ? (q.change_pct>0?'+':'')+q.change_pct.toFixed(2)+'%' : '--';
      pctEl.className = q.change_pct >= 0 ? 'up' : 'down';
    }
  }
}

async function api(path, method, body) {
  try {
    const opts = {method: method||'GET', headers:{'Content-Type':'application/json'}};
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(API+path, opts);
    return await r.json();
  } catch(e) { return null; }
}

// ---- Dashboard ----
async function refreshDashboard() {
  const [status, perf] = await Promise.all([api('/api/status'), api('/api/performance')]);
  if (!status) return;
  
  const m = status.market;
  const badge = document.getElementById('market-badge');
  if (m.is_market_open) { badge.textContent = '交易中'; badge.className = 'market-badge badge-open'; }
  else if (m.is_trade_day) { badge.textContent = '已收盘'; badge.className = 'market-badge badge-closed'; }
  else { badge.textContent = '休市'; badge.className = 'market-badge badge-closed'; }
  
  const ps = status.portfolio_summary;
  document.getElementById('kpi-total').textContent = formatMoney(ps.total_value);
  document.getElementById('kpi-pos').textContent = ps.n_positions;
  
  const pnl = ps.total_value - 1000000;
  const pnlClass = pnl >= 0 ? 'up' : 'down';
  document.getElementById('kpi-pnl').innerHTML = `<span class="${pnlClass}">${pnl>=0?'+':''}${formatMoney(pnl)}</span>`;

  // Enhanced metrics from performance if available
  if (perf && perf.portfolio && perf.portfolio.positions && perf.portfolio.positions.length > 0) {
    document.getElementById('kpi-grid2').style.display = '';
    const dd = perf.alerts && perf.alerts.length ? '触发告警' : '正常';
    document.getElementById('kpi-maxdd').textContent = dd;
  }
  
  // Alerts
  const alertsDiv = document.getElementById('alerts-container');
  if (perf && perf.alerts && perf.alerts.length) {
    alertsDiv.innerHTML = perf.alerts.map(a => `<div class="alert">⚠ ${a}</div>`).join('');
  } else {
    alertsDiv.innerHTML = '';
  }
  
  // Positions table
  if (perf && perf.portfolio && perf.portfolio.positions) {
    const pos = perf.portfolio.positions;
    const tbody = document.querySelector('#positions-table tbody');
    if (pos.length) {
      tbody.innerHTML = pos.map(p => `<tr>
        <td>${p.code||''}</td><td>${p.name||''}</td><td>${p.shares||0}</td>
        <td>${p.price||0}</td><td>${p.cost||0}</td>
        <td class="${(p.pnl||0)>=0?'up':'down'}">${p.pnl_pct||'0%'}</td>
        <td>${p.weight||'0%'}</td>
      </tr>`).join('');
    } else {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">暂无持仓</td></tr>';
    }
  }
}

// ---- Signals ----
async function loadSignals(refresh) {
  const el = document.getElementById('signals-empty');
  const table = document.getElementById('signals-table');
  const updated = document.getElementById('signal-updated');
  
  const data = await api(`/api/signals?top_n=30&refresh=${refresh?'true':'false'}`);
  if (!data || !data.signals || !data.signals.length) {
    el.style.display = 'block'; table.style.display = 'none';
    return;
  }
  el.style.display = 'none'; table.style.display = '';
  updated.textContent = new Date().toLocaleTimeString();
  
  const tbody = table.querySelector('tbody');
  tbody.innerHTML = data.signals.map((s,i) => `<tr>
    <td>${i+1}</td><td>${s.code||''}</td><td>${s.name||''}</td>
    <td>${(s.score||0).toFixed(2)}</td>
    <td class="${(s.change_pct||0)>=0?'up':'down'}">${(s.change_pct||0)>0?'+':''}${(s.change_pct||0).toFixed(2)}%</td>
    <td><span class="badge badge-tag">${s.source||'--'}</span></td>
    <td>${s.reason||''}</td>
  </tr>`).join('');
}

// ---- Backtest Results ----
let btPollTimer = null;

async function loadBacktestResults() {
  const data = await api('/api/backtest/results');
  const container = document.getElementById('bt-results');
  const meta = document.getElementById('bt-meta');
  const metricsGrid = document.getElementById('bt-metrics-grid');
  const equityChart = document.getElementById('bt-equity-chart');
  const monthlyContainer = document.getElementById('bt-monthly-container');

  if (!data || data.status === 'no_results') {
    container.style.display = 'none';
    return;
  }

  container.style.display = 'block';
  meta.textContent = `策略: ${data.strategy} | 交易日: ${data.n_trade_days||'--'}天 | 终值: ¥${(data.final_value||0).toFixed(2)} | ${data.updated||''}`;

  // Metrics
  const m = data.metrics || {};
  const metricDefs = [
    {key:'Total_Return', label:'累计收益', fmt:v=>fmtPct(v)},
    {key:'Annual_Return', label:'年化收益', fmt:v=>fmtPct(v)},
    {key:'Annual_Vol', label:'年化波动', fmt:v=>fmtPct(v)},
    {key:'Sharpe', label:'Sharpe', fmt:v=>v.toFixed(2)},
    {key:'Sortino', label:'Sortino', fmt:v=>v.toFixed(2)},
    {key:'Max_Drawdown', label:'最大回撤', fmt:v=>fmtPct(v)},
    {key:'Win_Rate', label:'胜率', fmt:v=>fmtPct(v)},
    {key:'Profit_Loss_Ratio', label:'盈亏比', fmt:v=>v.toFixed(2)},
    {key:'Calmar', label:'Calmar', fmt:v=>v.toFixed(2)},
    {key:'Omega', label:'Omega', fmt:v=>v.toFixed(2)},
  ];
  metricsGrid.innerHTML = metricDefs.map(def => {
    const val = m[def.key];
    if (val === undefined || val === null) return '';
    const isGood = ['Sharpe','Sortino','Calmar','Omega','Win_Rate','Profit_Loss_Ratio','Total_Return','Annual_Return'].includes(def.key);
    const cls = (typeof val === 'number') ? (val >= 0 ? 'up' : 'down') : '';
    return `<div class="card"><h3>${def.label}</h3><div class="value ${cls}" style="font-size:22px">${def.fmt(val)}</div></div>`;
  }).join('');

  // Equity curve (simple SVG polyline)
  const eq = data.equity || [];
  if (eq.length > 1) {
    const containerWidth = equityChart.parentElement?.clientWidth || 600;
    const W = Math.max(containerWidth - 32, 400);
    const H = 220;
    const pad = 10;
    const vals = eq.map(e => e.cum_return);
    const minV = Math.min(...vals);
    const maxV = Math.max(...vals);
    const range = maxV - minV || 1;

    const points = eq.map((e, i) => {
      const x = pad + (i / (eq.length - 1)) * (W - 2 * pad);
      const y = pad + (1 - (e.cum_return - minV) / range) * (H - 2 * pad);
      return `${x},${y}`;
    }).join(' ');

    // Y-axis labels
    const yLabels = [];
    for (let i = 0; i <= 4; i++) {
      const v = minV + (range * i) / 4;
      const y = pad + (1 - i / 4) * (H - 2 * pad);
      yLabels.push(`<text x="${pad-4}" y="${y+4}" text-anchor="end" fill="var(--muted)" font-size="10">${fmtPct(v/100)}</text>`);
    }

    // X-axis labels (first, middle, last)
    const xLabels = [
      `<text x="${pad}" y="${H-2}" fill="var(--muted)" font-size="10">${eq[0].date}</text>`,
      `<text x="${W/2}" y="${H-2}" text-anchor="middle" fill="var(--muted)" font-size="10">${eq[Math.floor(eq.length/2)].date}</text>`,
      `<text x="${W-pad}" y="${H-2}" text-anchor="end" fill="var(--muted)" font-size="10">${eq[eq.length-1].date}</text>`,
    ];

    const isPositive = vals[vals.length-1] >= vals[0];
    equityChart.innerHTML = `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" style="background:var(--bg)">
      <polyline points="${points}" fill="none" stroke="${isPositive?'var(--green)':'var(--red)'}" stroke-width="2"/>
      ${yLabels.join('')}
      ${xLabels.join('')}
    </svg>`;
  } else {
    equityChart.innerHTML = '<div class="empty">净值数据不足</div>';
  }

  // Yearly returns table
  const yearly = data.yearly_returns || [];
  const yearlyContainer = document.getElementById('bt-yearly-container');
  if (yearly.length > 0) {
    yearlyContainer.innerHTML = `<table><thead><tr><th>年份</th><th>收益率</th></tr></thead><tbody>
      ${yearly.map(y => {
        const cls = y.return >= 0 ? 'up' : 'down';
        return `<tr><td>${y.period}</td><td class="${cls}">${y.return >= 0 ? '+' : ''}${y.return.toFixed(2)}%</td></tr>`;
      }).join('')}
    </tbody></table>`;
  } else {
    yearlyContainer.innerHTML = '<div class="empty">年度数据不足</div>';
  }

  // Monthly returns table
  const monthly = data.monthly_returns || [];
  if (monthly.length > 0) {
    const years = [...new Set(monthly.map(m => m.period.substring(0,4)))].sort();
    const months = ['01','02','03','04','05','06','07','08','09','10','11','12'];
    let html = '<table><thead><tr><th>年份</th>';
    months.forEach(m => { html += `<th>${m}月</th>`; });
    html += '<th>年化</th></tr></thead><tbody>';

    years.forEach(year => {
      const yearData = monthly.filter(m => m.period.startsWith(year));
      const yearRet = yearData.reduce((acc, m) => acc * (1 + m.return/100) - 1, 0);
      html += `<tr><td>${year}</td>`;
      months.forEach(month => {
        const found = yearData.find(m => m.period === `${year}-${month}`);
        if (found) {
          const cls = found.return >= 0 ? 'up' : 'down';
          html += `<td class="${cls}">${found.return > 0 ? '+' : ''}${found.return.toFixed(2)}</td>`;
        } else {
          html += '<td style="color:var(--muted)">--</td>';
        }
      });
      html += `<td>${yearRet >= 0 ? '+' : ''}${(yearRet*100).toFixed(2)}%</td></tr>`;
    });
    html += '</tbody></table>';
    monthlyContainer.innerHTML = html;
  } else {
    monthlyContainer.innerHTML = '<div class="empty">月度数据不足</div>';
  }
}

function fmtPct(v) {
  if (v === undefined || v === null) return '--';
  return (v >= 0 ? '+' : '') + (v * 100).toFixed(2) + '%';
}

async function triggerBacktest() {
  const strategy = document.getElementById('bt-strategy').value;
  const stocks = document.getElementById('bt-stocks').value;
  const start = document.getElementById('bt-start').value;
  const end = document.getElementById('bt-end').value;
  const activePeriod = document.querySelector('.period-btn.active');
  const period = activePeriod ? activePeriod.dataset.period : '';
  const status = document.getElementById('bt-status');
  const log = document.getElementById('bt-log');
  
  status.innerHTML = '⏳ 正在启动回测...';
  log.style.display = 'block';
  log.innerHTML += `[${new Date().toLocaleTimeString()}] 提交: strategy=${strategy}, period=${period||'自定义'}, stocks=${stocks}<br>`;
  
  const r = await api('/api/backtest', 'POST', {strategy, stocks, start, end, period});
  if (r) {
    status.innerHTML = `✅ 已提交: ${strategy} (${period||start+'~'+end})`;
    log.innerHTML += `[${new Date().toLocaleTimeString()}] ${r.message || '回测运行中...'}<br>`;
    // Start polling for results
    if (btPollTimer) clearInterval(btPollTimer);
    btPollTimer = setInterval(async () => {
      const res = await api('/api/backtest/results');
      if (res && res.metrics) {
        log.innerHTML += `[${new Date().toLocaleTimeString()}] ✅ 回测完成<br>`;
        loadBacktestResults();
        clearInterval(btPollTimer);
        btPollTimer = null;
      }
    }, 3000);
  } else {
    status.innerHTML = '❌ 提交失败';
  }
}

async function loadStrategies() {
  const data = await api('/api/strategies');
  const list = document.getElementById('strategy-list');
  const count = document.getElementById('strategy-count');
  
  // Load strategy types into editor dropdown
  const typesData = await api('/api/strategies/types');
  const typeSel = document.getElementById('s-type');
  if (typesData && typesData.types) {
    typeSel.innerHTML = typesData.types.map(t =>
      `<option value="${t.id}">${t.desc || t.id}</option>`
    ).join('');
  }
  
  if (!data || !data.strategies.length) {
    list.innerHTML = '<div class="empty">暂无策略，点击"新建策略"开始</div>';
    count.textContent = '';
    return;
  }
  count.textContent = `${data.strategies.length} 个策略`;
  
  // Build type name map from API
  const typeNames = {};
  if (typesData && typesData.types) {
    typesData.types.forEach(t => { typeNames[t.id] = t.desc || t.id; });
  }
  
  list.innerHTML = data.strategies.map(s => {
    const statusBadge = s.status === 'active' ? 'badge-open' : 'badge-closed';
    const statusText = s.status === 'active' ? '活跃' : s.status === 'draft' ? '草稿' : '归档';
    const typeName = typeNames[s.type] || s.type;
    const params = typeof s.params === 'string' ? s.params : JSON.stringify(s.params, null, 2);
    
    return `<div class="card" style="margin-bottom:12px">
      <div class="flex" style="justify-content:space-between;align-items:start;margin-bottom:8px">
        <div>
          <strong style="font-size:15px">${s.name||'未命名'}</strong>
          <span class="badge badge-tag" style="margin-left:8px">${typeName}</span>
          <span class="market-badge ${statusBadge}" style="margin-left:4px">${statusText}</span>
          <span style="font-size:11px;color:var(--muted);margin-left:8px">${s.category||''}</span>
        </div>
        <div class="flex" style="gap:4px">
          <button class="btn btn-sm btn-outline" onclick="runStrategy('${s.id}')" title="运行回测">▶ 运行</button>
          <button class="btn btn-sm btn-outline" onclick="duplicateStrategy('${s.id}')" title="复制">📋</button>
          <button class="btn btn-sm btn-outline" onclick="editStrategy('${s.id}')" title="编辑">✏️</button>
          <button class="btn btn-sm btn-outline" onclick="toggleStrategy('${s.id}')" title="${s.status==='active'?'归档':'启用'}">${s.status==='active'?'📦':'✅'}</button>
          <button class="btn btn-sm btn-outline" onclick="deleteStrategy('${s.id}')" style="color:var(--red)" title="删除">🗑</button>
        </div>
      </div>
      <p style="font-size:13px;color:var(--muted);margin:4px 0">${s.description||'无描述'}</p>
      <details style="font-size:12px;margin-top:8px">
        <summary style="color:var(--blue);cursor:pointer">查看参数</summary>
        <pre style="background:var(--bg);padding:8px;border-radius:4px;overflow-x:auto;font-size:11px">${params.substring(0,500)}</pre>
      </details>
      ${s.notes ? `<p style="font-size:11px;color:var(--yellow);margin-top:4px">💡 ${s.notes}</p>` : ''}
      <div style="font-size:10px;color:var(--muted);margin-top:6px">ID: ${s.id} | 更新: ${(s.updated||'').substring(0,16)}</div>
    </div>`;
  }).join('');
}

function openStrategyEditor(s) {
  document.getElementById('strategy-editor').style.display = 'block';
  if (s) {
    document.getElementById('editor-title').textContent = '编辑策略: ' + (s.name||s.id);
    document.getElementById('s-id').value = s.id||'';
    document.getElementById('s-id').readOnly = true;
    document.getElementById('s-name').value = s.name||'';
    document.getElementById('s-type').value = s.type||'custom';
    document.getElementById('s-category').value = s.category||'';
    document.getElementById('s-status').value = s.status||'active';
    document.getElementById('s-desc').value = s.description||'';
    document.getElementById('s-params').value = typeof s.params==='string' ? s.params : JSON.stringify(s.params||{}, null, 2);
    document.getElementById('s-notes').value = s.notes||'';
  } else {
    document.getElementById('editor-title').textContent = '新建策略';
    document.getElementById('s-id').value = '';
    document.getElementById('s-id').readOnly = false;
    document.getElementById('s-name').value = '';
    document.getElementById('s-desc').value = '';
    document.getElementById('s-params').value = '{}';
    document.getElementById('s-notes').value = '';
    document.getElementById('s-type').value = 'custom';
    document.getElementById('s-category').value = '';
    document.getElementById('s-status').value = 'draft';
  }
}

function closeStrategyEditor() {
  document.getElementById('strategy-editor').style.display = 'none';
}

async function saveStrategy() {
  const s = {
    id: document.getElementById('s-id').value.trim(),
    name: document.getElementById('s-name').value.trim(),
    type: document.getElementById('s-type').value,
    category: document.getElementById('s-category').value.trim(),
    status: document.getElementById('s-status').value,
    description: document.getElementById('s-desc').value.trim(),
    notes: document.getElementById('s-notes').value.trim(),
  };
  
  let params = {};
  try { params = JSON.parse(document.getElementById('s-params').value); }
  catch(e) { alert('参数JSON格式错误'); return; }
  s.params = params;
  
  if (!s.id) { alert('策略ID不能为空'); return; }
  
  const r = await api('/api/strategies', 'POST', {action:'save', strategy:s});
  if (r && r.success) {
    closeStrategyEditor();
    loadStrategies();
  } else {
    alert('保存失败');
  }
}

async function editStrategy(id) {
  const data = await api('/api/strategies');
  const s = (data?.strategies||[]).find(x => x.id === id);
  if (s) openStrategyEditor(s);
}

async function deleteStrategy(id) {
  if (!confirm(`确认删除策略 "${id}"？`)) return;
  await api('/api/strategies', 'POST', {action:'delete', id});
  loadStrategies();
}

async function duplicateStrategy(id) {
  const newId = id + '_copy_' + Date.now().toString(36);
  await api('/api/strategies', 'POST', {action:'duplicate', id, new_id: newId});
  loadStrategies();
}

async function toggleStrategy(id) {
  await api('/api/strategies', 'POST', {action:'toggle', id});
  loadStrategies();
}

async function runStrategy(id) {
  const r = await api('/api/strategies/run', 'POST', {id});
  if (r) alert(`策略 "${id}" 回测已提交，结果输出到终端`);
}

// ---- Utils ----
function formatMoney(v) {
  if (v === undefined || v === null) return '--';
  return (v/10000).toFixed(2) + ' 万';
}

// ---- Init ----
refreshDashboard();
loadSignals();
loadHotStocks();
autoRefresh = setInterval(refreshDashboard, 30000);
</script>
